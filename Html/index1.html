<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>

<!-- text decoration -->
    <p class="text-decoration-underline">underline</p>
    <p class="text-decoration-line-through">underline</p>
    <a href="" class="text-decoration-none">Link</a>

<!-- margin -->
    <p class="bg-secondary mt-4">Margin top</p>
    <p class="bg-danger mb-1">Margin bottom</p>
    <p class="bg-warning me-4">Margin left</p>
    <p class="bg-info ms-4">Margin right</p>
    <p class="bg-success m-4">All Margin</p>
    <p class="bg-primary mx-3"> Margin left right</p>
    <p class="bg-black text-white my-4"> Margin top bottom</p>

<!-- padding -->
    <p class="bg-danger pt-2">padding top</p>
    <p class="bg-success pb-3">padding bottom</p>
    <p class="bg-secondary ps-3">padding left</p>
    <p class="bg-warning text-end pe-4">padding right</p>
    <p class="bg-info p-4">padding all</p>
    <p class="bg-black text-white px-4">padding left and right</p>
    <p class="bg-primary py-4">padding top and bottom</p>
    
    
</body>
</html>
